<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>矩形区域选取 — Smart-Sports-AutoLocate</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Microsoft YaHei', sans-serif; background: #1a1a2e; color: #eee; }
  #container { display: flex; height: 100vh; }
  #map { flex: 1; min-width: 0; }
  #panel { width: 360px; padding: 20px; overflow-y: auto; background: #16213e; }
  h2 { font-size: 18px; margin-bottom: 16px; color: #e94560; }
  label { display: block; font-size: 13px; color: #aaa; margin: 10px 0 4px; }
  input, button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px; }
  input { background: #0f3460; color: #eee; }
  button { background: #e94560; color: #fff; cursor: pointer; font-weight: bold; margin-top: 10px; }
  button:hover { background: #c73e54; }
  button.secondary { background: #0f3460; color: #aaa; }
  button.secondary:hover { background: #1a4a7a; }
  .coord-box { background: #0f3460; border-radius: 8px; padding: 14px; margin: 12px 0; }
  .coord-box h3 { font-size: 14px; margin-bottom: 8px; color: #e94560; }
  .coord-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; font-family: 'Consolas', 'Courier New', monospace; }
  .coord-row span:last-child { color: #4ecca3; }
  #status { font-size: 12px; color: #888; margin-top: 8px; }
  .tip { font-size: 12px; color: #666; margin-top: 6px; line-height: 1.6; }
  .note { background: #0f3460; border-left: 3px solid #e94560; padding: 10px 14px; margin-top: 12px; font-size: 12px; color: #ccc; border-radius: 0 6px 6px 0; }
</style>
</head>
<body>
<div id="container">
  <div id="map"></div>
  <div id="panel">
    <h2>矩形区域选取</h2>
    <p class="tip">点击下方按钮，在地图上拖拽画一个矩形。画完自动显示四个角坐标。</p>

    <button id="btnDraw" onclick="startDraw()">画矩形</button>
    <button class="secondary" onclick="clearRect()">清除重画</button>

    <div class="coord-box" id="coordBox" style="display:none">
      <h3>矩形四角坐标</h3>
      <div class="coord-row"><span>西北 NW</span><span id="nw"></span></div>
      <div class="coord-row"><span>东北 NE</span><span id="ne"></span></div>
      <div class="coord-row"><span>东南 SE</span><span id="se"></span></div>
      <div class="coord-row"><span>西南 SW</span><span id="sw"></span></div>
      <div style="margin-top:10px; font-size:12px; color:#aaa">
        宽度 <span id="width_m" style="color:#4ecca3">--</span> 米 &nbsp;
        高度 <span id="height_m" style="color:#4ecca3">--</span> 米
      </div>
    </div>

    <button id="btnCopy" onclick="copyConfig()" style="display:none">复制 config.json 配置</button>

    <div class="note" id="note" style="display:none">
      上面是<strong>西北角和东南角</strong>两个对角坐标，可直接填入程序菜单。
    </div>

    <p id="status"></p>
  </div>
</div>

<script src="https://api.map.baidu.com/api?v=3.0&type=webgl&ak=你的百度地图AK密钥"></script>
<script>
// ========== 填入你的百度地图 AK ==========
const BAIXU_AK = '你的百度地图AK密钥';

var map = new BMapGL.Map('map');
map.centerAndZoom(new BMapGL.Point(116.404, 39.915), 15);
map.enableScrollWheelZoom(true);
map.setMapType(BMAP_EARTH_MAP);

var drawingManager = null;
var overlay = null;
var bounds = null;

function initDrawingManager() {
  drawingManager = new BMapGLLib.DrawingManager(map, {
    isOpen: false,
    drawingType: BMAP_DRAWING_RECTANGLE,
    rectangleOptions: {
      strokeColor: '#e94560',
      strokeWeight: 3,
      strokeOpacity: 0.9,
      fillColor: '#e94560',
      fillOpacity: 0.15,
    }
  });

  drawingManager.addEventListener('overlaycomplete', function(e) {
    if (overlay) { map.removeOverlay(overlay); }
    overlay = e.overlay;
    bounds = overlay.getBounds();
    updateCoords();
    drawingManager.close();
    document.getElementById('btnDraw').style.display = 'block';
    document.getElementById('status').textContent = '';
  });
}

function startDraw() {
  if (!drawingManager) initDrawingManager();
  document.getElementById('status').textContent = '在地图上拖拽画矩形...';
  document.getElementById('btnDraw').style.display = 'none';
  drawingManager.open();
}

function clearRect() {
  if (overlay) { map.removeOverlay(overlay); overlay = null; bounds = null; }
  document.getElementById('coordBox').style.display = 'none';
  document.getElementById('btnCopy').style.display = 'none';
  document.getElementById('note').style.display = 'none';
}

function updateCoords() {
  var sw = bounds.getSouthWest();
  var ne = bounds.getNorthEast();

  // 四角
  var nw = { lat: ne.lat, lng: sw.lng };
  var se = { lat: sw.lat, lng: ne.lng };

  document.getElementById('nw').textContent = nw.lat.toFixed(8) + ', ' + nw.lng.toFixed(8);
  document.getElementById('ne').textContent = ne.lat.toFixed(8) + ', ' + ne.lng.toFixed(8);
  document.getElementById('se').textContent = se.lat.toFixed(8) + ', ' + se.lng.toFixed(8);
  document.getElementById('sw').textContent = sw.lat.toFixed(8) + ', ' + sw.lng.toFixed(8);

  // 尺寸
  var w_m = map.getDistance(new BMapGL.Point(nw.lng, nw.lat), new BMapGL.Point(ne.lng, ne.lat));
  var h_m = map.getDistance(new BMapGL.Point(nw.lng, nw.lat), new BMapGL.Point(sw.lng, sw.lat));
  document.getElementById('width_m').textContent = w_m.toFixed(1);
  document.getElementById('height_m').textContent = h_m.toFixed(1);

  document.getElementById('coordBox').style.display = 'block';
  document.getElementById('btnCopy').style.display = 'block';
  document.getElementById('note').style.display = 'block';

  // 把 NW 和 SE 存到全局变量供复制用
  window._nw = nw;
  window._se = se;
}

function copyConfig() {
  var rw = {
    speed_ms: 3.0,
    direction_change_stddev: 5.0,
    duration_seconds: 1800,
    corners: {
      nw: { lat: parseFloat(window._nw.lat.toFixed(8)), lng: parseFloat(window._nw.lng.toFixed(8)) },
      ne: { lat: parseFloat(window._nw.lat.toFixed(8)), lng: parseFloat(window._se.lng.toFixed(8)) },
      se: { lat: parseFloat(window._se.lat.toFixed(8)), lng: parseFloat(window._se.lng.toFixed(8)) },
      sw: { lat: parseFloat(window._se.lat.toFixed(8)), lng: parseFloat(window._nw.lng.toFixed(8)) },
    }
  };
  var cfg = {
    mode: "random_walk",
    loop_count: 10,
    point_interval: 0.1,
    jitter_meters: 1.0,
    midpoint_probability: 0.15,
    random_walk: rw
  };
  var json = JSON.stringify(cfg, null, 4);
  navigator.clipboard.writeText(json).then(function() {
    document.getElementById('status').textContent = '已复制到剪贴板！粘贴到 config.json 即可';
    document.getElementById('status').style.color = '#4ecca3';
  }).catch(function() {
    document.getElementById('status').textContent = '复制失败，请手动复制上方坐标';
    document.getElementById('status').style.color = '#e94560';
  });
}
</script>
<script src="https://cdn.bootcdn.net/ajax/libs/DrawingManager/1.0/DrawingManager.min.js"></script>
</body>
</html>
