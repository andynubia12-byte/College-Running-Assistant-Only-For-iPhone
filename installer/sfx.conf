; WinRAR SFX config for GeoPilot
; Usage: WinRAR a -sfx -z"installer\sfx.conf" dist\GeoPilot_setup.exe dist\GeoPilot\*

; ---- Title ----
Title=GeoPilot Setup - iOS Virtual Location Tool
TempMode=Geopilot setup
Silent=2
Overwrite=1

; ---- Paths ----
Path=%LOCALAPPDATA%\GeoPilot
Setup=GeoPilot.exe

; ---- Shortcuts ----
Shortcut=D, GeoPilot.exe, GeoPilot, iOS\Virtual\Location\Tool
Shortcut=P, GeoPilot.exe, GeoPilot\GeoPilot
